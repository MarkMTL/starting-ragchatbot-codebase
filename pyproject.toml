[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "black>=25.1.0",
    "ruff>=0.9.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end tests hitting the real ChromaDB + Anthropic API",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting.
# E501 (line length) left to black; ruff only sorts/flags, does not reflow strings.
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# app.py sets a warnings filter before importing; conftest.py inserts backend/
# onto sys.path before importing backend modules. Both require imports below
# top-of-file statements (E402).
"backend/app.py" = ["E402"]
"backend/tests/conftest.py" = ["E402"]
